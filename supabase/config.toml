[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://localhost:54321"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
port = 54325
file_size_limit = "50MiB"
image_transformation_enabled = true

[auth]
enabled = true
port = 54321
site_url = "http://localhost:3000"
additional_redirect_urls = ["fieldops://"]
jwt_expiry = 3600
enable_signup = true
enable_confirmations = false
enable_manual_linking = true
external_phone_enabled = true
external_email_enabled = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.sms]
enable_confirmations = false

[auth.external.google]
enabled = false

[functions.process-voice-log]
enabled = true
verify_jwt = true
import_map = "./functions/process-voice-log/import_map.json"
entrypoint = "./functions/process-voice-log/index.ts"

[functions.parse-receipt]
enabled = true
verify_jwt = true
import_map = "./functions/parse-receipt/import_map.json"
entrypoint = "./functions/parse-receipt/index.ts"

[functions.create-payment-link]
enabled = true
verify_jwt = true
import_map = "./functions/create-payment-link/import_map.json"
entrypoint = "./functions/create-payment-link/index.ts"
